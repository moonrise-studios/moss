plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

def id = "MyPlugin"
group = 'com.example.myplugin'
version = '1.0.0'

repositories {
    mavenCentral()

    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")

    // IMPORTANT: We need to compile Spring Context for this to work!
    implementation("org.springframework:spring-context:6.2.13")

    // Moss (Velocity Platform)
    implementation(files(project(":moss").sourceSets.main.output))
    implementation(files(project(":moss-velocity").sourceSets.main.output))
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks {
    build {
        dependsOn(shadowJar)
    }
}

shadowJar {
    archiveBaseName.set("${id}")
    archiveClassifier.set("")
    archiveVersion.set("")

    relocate("gg.moonrise.moss", "${group}.libs.moss")
    // relocate other dependencies such as Spring
}
