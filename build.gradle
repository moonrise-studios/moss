import com.vanniktech.maven.publish.DeploymentValidation
import com.vanniktech.maven.publish.MavenPublishBaseExtension

plugins {
    id 'java'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish.base' version '0.36.0' apply false
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok
    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")
}

subprojects { subproject ->
    subproject.pluginManager.withPlugin('maven-publish') {
        def sourceUrl = 'https://github.com/moonrise-studios/moss'
        subproject.description = "Moss dependency injection and lifecycle management (${subproject.name})"
        def publishing = subproject.extensions.getByType(PublishingExtension)

        publishing.publications.withType(MavenPublication).configureEach {
            pom.scm {
                url = sourceUrl
                connection = "scm:git:${sourceUrl}.git"
                developerConnection = 'scm:git:ssh://git@github.com/moonrise-studios/moss.git'
            }
        }

        if (subproject.providers.gradleProperty('centralRelease').isPresent()) {
            subproject.pluginManager.apply('com.vanniktech.maven.publish.base')
            def central = subproject.extensions.getByType(MavenPublishBaseExtension)
            subproject.afterEvaluate {
                def publication = publishing.publications.named('mavenJava', MavenPublication).get()
                central.coordinates(publication.groupId, publication.artifactId, publication.version)
            }
            central.publishToMavenCentral(true, DeploymentValidation.PUBLISHED)
            central.signAllPublications()
        }

        publishing.repositories.maven {
            name = "nexus"

            def snapshotsUrl = subproject.findProperty("nexusSnapshotsUrl") ?: "https://repo.moonrise.gg/repository/maven-snapshots"
            def releasesUrl = subproject.findProperty("nexusReleasesUrl") ?: "https://repo.moonrise.gg/repository/maven-releases"

            def isRelease = subproject.findProperty("isRelease") == "true"
            url = subproject.uri(isRelease ? releasesUrl : snapshotsUrl)

            credentials {
                username = subproject.findProperty("nexusUsername")
                password = subproject.findProperty("nexusPassword")
            }
        }
    }
}
